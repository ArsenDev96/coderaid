name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, validate, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Mission content is hand-authored TypeScript that compiles even when it
      # is wrong; this is the check that reads it as content.
      - name: Validate mission content
        run: npm run validate:missions

      # MUST run before the tests. `tests/bundle-secrecy.test.ts` greps the real
      # build output for the answer fields that were removed from the client
      # bundle, and skips itself when `.next` is absent so a clean checkout can
      # still run the suite. On a fresh CI checkout that meant it skipped every
      # time — the one guard protecting the answers was silently doing nothing.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  # Kept separate from the gates above: a browser download is slower and
  # flakier than the pure checks, and it must not be able to mask them.
  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # An ephemeral Supabase stack, per run, in Docker on the runner.
      #
      # This replaced the live project on 2026-07-31 (§12 item 2). Every push
      # used to create and delete real users in production, and the replay-limit
      # and reset specs write ~40 rows each time. Nothing here touches it.
      #
      # It also closes a trap that had bitten twice: `supabase/migrations/` is
      # applied BY HAND to the hosted project, so a migration could sit in the
      # tree unapplied — or, as 0004 did, fail to apply at all — while CI stayed
      # green. `supabase start` applies all of them from scratch on every run, so
      # a migration that cannot be applied is now a red build rather than a
      # surprise in the dashboard.
      - name: Start Supabase
        run: npx supabase start

      # The local stack's keys are fixed, published demo values — they are not
      # secrets and are deliberately written out rather than stored as such.
      # `supabase status -o env` emits them under the names the app expects.
      - name: Export the local stack's keys
        run: |
          npx supabase status -o env \
            | sed -E 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/;
                      s/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/;
                      s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | tr -d '"' >> "$GITHUB_ENV"

      # Builds and serves the app through the Playwright webServer config.
      #
      # The keys are now always present, so `hasCredentials()` no longer skips
      # the authenticated specs — including on a fork's pull request, which
      # could never read the repository secrets and therefore skipped the 20
      # specs that matter most. A skipped run is the same colour as a passing
      # one, and that is no longer a way this suite can go quiet.
      - name: Play a mission through the real UI
        run: npm run test:e2e

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
