name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, validate, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Mission content is hand-authored TypeScript that compiles even when it
      # is wrong; this is the check that reads it as content.
      - name: Validate mission content
        run: npm run validate:missions

      # MUST run before the tests. `tests/bundle-secrecy.test.ts` greps the real
      # build output for the answer fields that were removed from the client
      # bundle, and skips itself when `.next` is absent so a clean checkout can
      # still run the suite. On a fresh CI checkout that meant it skipped every
      # time — the one guard protecting the answers was silently doing nothing.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  # Kept separate from the gates above: a browser download is slower and
  # flakier than the pure checks, and it must not be able to mask them.
  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds and serves the app through the Playwright webServer config.
      #
      # The Supabase keys are what let `e2e/authenticated.spec.ts` mint a
      # session and cross the sign-in wall. They are deliberately not required:
      # `hasCredentials()` skips that file when they are absent, so a fork's
      # pull request — which cannot read secrets — skips those specs rather than
      # failing red on credentials it was never going to be given.
      - name: Play a mission through the real UI
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
